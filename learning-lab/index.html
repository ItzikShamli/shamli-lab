<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Learning Lab</title>
  <style>
    :root { --bg: #eef7ff; --ink: #1f3550; --card: #ffffff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px; gap: 32px; -webkit-tap-highlight-color: transparent;
    }
    header { display: flex; align-items: center; gap: 24px; }
    h1 { margin: 0; font-size: 40px; }
    a.back {
      width: 80px; height: 80px; border-radius: 24px; background: var(--card);
      display: flex; align-items: center; justify-content: center; font-size: 44px;
      text-decoration: none; box-shadow: 0 6px 0 #c9def2;
    }
    .grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
    a.card {
      width: 280px; height: 280px; border-radius: 40px; background: var(--card);
      box-shadow: 0 10px 0 #c9def2, 0 14px 30px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; color: var(--ink); font-size: 26px; font-weight: 700; gap: 12px;
      transition: transform .1s;
    }
    a.card:active { transform: translateY(6px); box-shadow: 0 4px 0 #c9def2; }
    a.card .pic { font-size: 110px; line-height: 1; }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../" aria-label="Home">🏠</a>
    <h1>🎓 Learning Lab</h1>
  </header>
  <div class="grid">
    <a class="card" href="fun-with-math/" aria-label="Fun With Math">
      <span class="pic">🔢</span>
      <span>Fun With Math</span>
    </a>
  </div>
</body>
</html>
