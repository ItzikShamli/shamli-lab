<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Shamli Lab</title>
  <style>
    :root { --bg: #fff8ec; --ink: #3b2f2f; --card: #ffffff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px; gap: 32px; -webkit-tap-highlight-color: transparent;
    }
    h1 { margin: 0; font-size: 40px; }
    .grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; }
    a.card {
      width: 260px; height: 260px; border-radius: 40px; background: var(--card);
      box-shadow: 0 10px 0 #f0d9b5, 0 14px 30px rgba(0,0,0,.08);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-decoration: none; color: var(--ink); font-size: 26px; font-weight: 700; gap: 12px;
      transition: transform .1s;
    }
    a.card:active { transform: translateY(6px); box-shadow: 0 4px 0 #f0d9b5; }
    a.card .pic { font-size: 120px; line-height: 1; }
  </style>
</head>
<body>
  <h1>🧪 Shamli Lab</h1>
  <div class="grid">
    <a class="card" href="learning-lab/" aria-label="Learning Lab">
      <span class="pic">🎓</span>
      <span>Learning Lab</span>
    </a>
    <a class="card" href="green-scientist/" aria-label="Green Scientist">
      <span class="pic">🌱</span>
      <span>המדען הירוק</span>
    </a>
  </div>
</body>
</html>
